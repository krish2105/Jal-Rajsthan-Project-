[project]
name = "jal"
version = "0.1.0"
description = "JAL (जल) — Rajasthan Groundwater Risk & Recharge Prioritiser"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pdfplumber>=0.11",
    "camelot-py[base]>=0.11",
    "rapidfuzz>=3.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.32",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pypdfium2>=5.13.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "pykrige>=1.7",
    "pulp>=2.9",
]
agents = [
    "openai>=1.40",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
