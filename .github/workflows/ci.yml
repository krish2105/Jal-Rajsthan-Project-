name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
      - name: Smoke test built app
        run: |
          pnpm exec next start -p 3999 &
          for i in $(seq 1 30); do curl -sf http://localhost:3999 >/dev/null && break; sleep 1; done
          HTML=$(curl -sf http://localhost:3999)
          echo "$HTML" | grep -q "JAL" || (echo "brand missing" && exit 1)
          echo "$HTML" | grep -qi "Rajasthan" || (echo "content missing" && exit 1)
          curl -sf http://localhost:3999/maplibre-worker.mjs >/dev/null || (echo "map worker missing" && exit 1)
          echo "smoke OK"
