name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan past commits, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run --with pip-audit pip-audit --skip-editable || true  # report, don't block (advisory)
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level high || true  # advisory
      - run: pnpm build
      - name: Smoke test built app
        run: |
          pnpm exec next start -p 3999 &
          for i in $(seq 1 30); do curl -sf http://localhost:3999 >/dev/null && break; sleep 1; done
          HTML=$(curl -sf http://localhost:3999)
          echo "$HTML" | grep -q "JAL" || (echo "brand missing" && exit 1)
          echo "$HTML" | grep -qi "Rajasthan" || (echo "content missing" && exit 1)
          curl -sf http://localhost:3999/maplibre-worker.mjs >/dev/null || (echo "map worker missing" && exit 1)
          echo "smoke OK"

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: echo "AUTH_SECRET=ci-only-secret-not-production" > .env.local
      - run: pnpm build
      - run: pnpm exec playwright test

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: echo "AUTH_SECRET=ci-only-secret-not-production" > .env.local
      - run: pnpm build
      # /login and /public are the only routes reachable without a session, so
      # they are what an outside auditor (or a minister's phone) actually loads
      - run: pnpm exec @lhci/cli@0.14.x autorun --config=.lighthouserc.json
